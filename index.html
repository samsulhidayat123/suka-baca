<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUKA BACA Manga - Premium</title>

    <link rel="icon" type="image/png" href="logok.png">

    <!-- 🔐 CSP (optional security) -->
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' https://cdn.jsdelivr.net https://*.supabase.co https://images.alphacoders.com;
    img-src * data:;
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    ">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CONFIG (KEY DI LUAR) -->
    <script src="config.js"></script>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #141414;
            --bg-nav: rgba(0, 0, 0, 0.95);
            --accent: #E50914;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            scroll-behavior: smooth;
        }

        .navbar {
            background-color: var(--bg-nav);
            backdrop-filter: blur(20px);
            padding: 10px 5%;
            position: fixed;
            width: 100%;
            top: 0;
            display: flex;
            justify-content: space-between;
            z-index: 1000;
        }

        .brand { font-weight: 800; font-size: 26px; color: var(--accent); cursor: pointer; }
        .brand span { color: white; }

        .view { display: none; padding-top: 80px; }
        .view.active { display: block; }

        .hero {
            height: 50vh;
            background: linear-gradient(to top, var(--bg-main), transparent),
            url('https://images.alphacoders.com/605/605592.png');
            background-size: cover;
            display: flex;
            align-items: center;
            padding: 0 5%;
        }

        .container { padding: 40px 5%; }

        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 25px;
        }

        .manga-card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
        }

        .manga-card:hover { transform: scale(1.05); }

        .manga-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .manga-card-info {
            padding: 12px;
            text-align: center;
            font-weight: 600;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .btn-chapter {
            background: #222;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }

        .btn-chapter:hover {
            background: var(--accent);
        }

        #reader-area { max-width: 800px; margin: auto; background: #000; }

        /* LAZY LOAD */
        .lazy-img {
            opacity: 0;
            transition: 0.6s;
        }

        .lazy-img.loaded {
            opacity: 1;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<nav class="navbar">
    <h1 class="brand" onclick="showHome()">SUKA<span>BACA</span></h1>
    <div id="nav-actions" style="display:none;">
        <button onclick="showHome()">BERANDA</button>
    </div>
</nav>

<!-- HOME -->
<div id="view-home" class="view active">
    <header class="hero">
        <div>
            <h1>Manga Collection</h1>
        </div>
    </header>

    <div class="container">
        <div id="manga-list" class="manga-grid">
            <div class="loading">Loading...</div>
        </div>
    </div>
</div>

<!-- DETAIL -->
<div id="view-detail" class="view">
    <div class="container">
        <h1 id="detail-title"></h1>
        <div id="chapter-list" class="chapter-grid"></div>
    </div>
</div>

<!-- READER -->
<div id="view-reader" class="view">
    <div id="reader-area"></div>
</div>

<script>
    // 🔐 AMBIL DARI CONFIG
    var CONFIG_URL = window.ENV?.SUPABASE_URL || "https://gonlvyxvmjgowvnpzljl.supabase.co";
    var CONFIG_KEY = window.ENV?.SUPABASE_KEY || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdvbmx2eXh2bWpnb3d2bnB6bGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDk2MDIsImV4cCI6MjA5MjUyNTYwMn0.HpnxbdJhNMdQNlXCD_tz-gvojTGMtg8rucQKpAUuSSw";   

    var supabase = window.supabase.createClient(CONFIG_URL, CONFIG_KEY);
    var currentManga = "";

    /* LAZY LOAD */
    const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.onload = () => img.classList.add('loaded');
                obs.unobserve(img);
            }
        });
    }, { rootMargin: "0px 0px 1000px 0px" });

    async function loadHome() {
        const { data } = await supabase.from('manga_chapters').select('judul, daftar_gambar');

        const container = document.getElementById('manga-list');
        container.innerHTML = "";

        const unique = [...new Set(data.map(x => x.judul))];

        unique.forEach(judul => {
            const item = data.find(x => x.judul === judul);

            let img = "";
            if (item.daftar_gambar) {
                let imgs = item.daftar_gambar;
                if (typeof imgs === "string") imgs = JSON.parse(imgs);
                img = imgs[0];
            }

            const el = document.createElement("div");
            el.className = "manga-card";

            el.innerHTML = `
                <img class="lazy-img" data-src="${img}">
                <div class="manga-card-info">${judul}</div>
            `;

            el.onclick = () => showDetail(judul);

            container.appendChild(el);
            observer.observe(el.querySelector("img"));
        });
    }

    async function showDetail(judul) {
        currentManga = judul;
        switchView('view-detail');

        document.getElementById('detail-title').innerText = judul;

        const { data } = await supabase
            .from('manga_chapters')
            .select('chapter')
            .eq('judul', judul)
            .order('chapter', { ascending: false });

        const container = document.getElementById('chapter-list');
        container.innerHTML = "";

        data.forEach(row => {
            const btn = document.createElement('div');
            btn.className = 'btn-chapter';
            btn.innerText = "Ch. " + row.chapter;
            btn.onclick = () => startReading(row.chapter);
            container.appendChild(btn);
        });
    }

    async function startReading(ch) {
        switchView('view-reader');

        const { data } = await supabase
            .from('manga_chapters')
            .select('daftar_gambar')
            .eq('judul', currentManga)
            .eq('chapter', ch)
            .single();

        let images = data.daftar_gambar;
        if (typeof images === "string") images = JSON.parse(images);

        const area = document.getElementById("reader-area");
        area.innerHTML = "";

        images.forEach(src => {
            const img = document.createElement("img");
            img.className = "lazy-img";
            img.dataset.src = src;
            area.appendChild(img);
            observer.observe(img);
        });
    }

    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function showHome() {
        switchView('view-home');
        document.getElementById('reader-area').innerHTML = '';
    }

    loadHome();
</script>

</body>
</html>
